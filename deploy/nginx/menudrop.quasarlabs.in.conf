# MenuDrop — nginx reverse proxy for menudrop.quasarlabs.in
# Place at /etc/nginx/sites-available/menudrop.quasarlabs.in and symlink into
# sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx
# (A reload is graceful — quasar.quasarlabs.in keeps serving, no restart.)
#
# After this is in place, get TLS with:
#   sudo certbot --nginx -d menudrop.quasarlabs.in
# certbot edits ONLY this server block (adds the 443 server + redirect).

server {
    listen 80;
    listen [::]:80;
    server_name menudrop.quasarlabs.in;

    # The app uploads base64 images (logo + rendered posters), which can be a
    # few MB. nginx's default 1m would reject them.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket / HMR upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 75s;
        proxy_cache_bypass $http_upgrade;
    }
}
