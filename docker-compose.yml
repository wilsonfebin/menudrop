# Isolated compose project — commands scoped to "menudrop" never touch other
# apps (e.g. quasar). Deploy with:  docker compose up -d --build
# The app binds to 127.0.0.1:3001 only; nginx on the host proxies the
# subdomain to it. Quasar keeps its own container/port untouched.
name: menudrop

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Public values inlined into the browser bundle at build time.
      # Auto-interpolated from the project's .env file (compose reads .env by
      # default), so a plain `docker compose up -d --build` is enough.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    container_name: menudrop-web
    # Localhost-only so it never clashes with another app's port and isn't
    # exposed publicly — nginx is the only thing that reaches it.
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Local dev convenience (not used in production).
  # Run with:  docker compose --profile dev up web-dev
  web-dev:
    image: node:20-bookworm-slim
    container_name: menudrop-web-dev
    working_dir: /app
    profiles: ["dev"]
    command: sh -c "apt-get update && apt-get install -y libvips-dev && npm install && npm run dev"
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
